# Copy to config.toml and edit. Every key is optional; defaults live in booth/config.py.

# "pi" or "desktop". Auto-detected when omitted.
# platform = "desktop"

[screen]
width = 320          # 3.5" TFT (480x320 panel) mounted portrait; the UI is laid out for this
height = 480
fullscreen = false
fps = 30
effects = true       # animations and transitions; set false if a slow Pi stutters

[camera]
backend = "auto"     # auto (picamera on Pi, webcam elsewhere) | picamera | opencv | mock
index = 0            # webcam index for opencv
width = 1280
height = 960
mirror = true        # mirror image like a selfie camera (preview and saved photos); false = normal view

[capture]
countdown_seconds = 3
interval_seconds = 2.5
hold_seconds = 1.5   # hold the shutter this long to retake
idle_timeout_seconds = 90

[gpio]               # BCM pin numbers, Pi only
shutter_pin = 17
back_pin = 27
led_pin = 22
buzzer_pin = 23

[printer]
backend = "none"     # none | thermal | file (writes preview PNGs to data/print_preview)
usb_vendor_id = 0x0416
usb_product_id = 0x5011
paper_width_px = 384 # 58mm thermal head
feed_lines = 4

[share]
enabled = true
port = 8000
base_url = ""        # empty = auto-detect LAN IP. Hotspot: "http://10.42.0.1:8000"
public = false       # true only for a cloud URL; enables QR on prints
hotspot_ssid = ""    # set to show a "Join Wi-Fi" QR next to the download QR
hotspot_password = ""

[storage]
data_dir = "data"
export_dir = "exports"
removable_media_roots = ["/media"]
downloads_dir = "~/Downloads/snips&pics"   # Save goes here when no card is plugged in
keep_sessions = 200

[branding]
text = "snips&pics"
